name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Deploys: Vercel Git integration builds a preview per PR and production from main.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Biome
        run: pnpm check
      - name: ESLint + Biome
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: TypeScript
        run: pnpm typecheck
      - name: Production build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    env:
      # e2e never calls OpenAI: /api/ask answers from a deterministic fixture when E2E_MOCK_LLM is set.
      E2E_MOCK_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright (Chromium)
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright E2E
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
